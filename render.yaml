# Render Blueprint for the Kantin Kwari API (https://render.com/docs/blueprint-spec).
# In Render: New + → Blueprint → select this repository. Values marked `sync: false` are asked for
# during setup (secrets are never committed). See docs/deploy-render.md for the full walkthrough.
services:
  - type: web
    name: kantin-kwari-api
    runtime: node
    # Frankfurt is the closest Render region to Nigeria.
    region: frankfurt
    # Starter keeps the API always on (the free plan sleeps after 15 minutes, which stops chat and
    # background jobs and makes the first request take ~1 minute).
    plan: starter
    branch: main
    # Installs only the API + shared workspaces (not the Expo app), then compiles TypeScript.
    buildCommand: npm ci --include=dev -w @kkdm/shared -w @kkdm/api --include-workspace-root && npm run build:api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Your Render URL, e.g. https://kantin-kwari-api.onrender.com (shown at the top of the service page).
      - key: API_BASE_URL
        sync: false
      # Atlas connection string, e.g. mongodb+srv://USER:PASS@cluster0.xxxxx.mongodb.net/
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: kkdm
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Cloudinary image storage. To use Cloudflare R2 instead, set STORAGE_PROVIDER=s3 and the
      # STORAGE_* values described in docs/deploy-render.md.
      - key: STORAGE_PROVIDER
        value: cloudinary
      # Cloudinary dashboard → "API environment variable": cloudinary://<api key>:<api secret>@<cloud name>
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: kantin-kwari
      # Verification codes: "none" until you add an email (SMTP) / SMS (Termii) provider.
      - key: VERIFICATION_EMAIL_PROVIDER
        value: none
      - key: VERIFICATION_SMS_PROVIDER
        value: none
      - key: IMAGE_EMBEDDING_PROVIDER
        value: none
      - key: PAYMENT_PROVIDER
        value: none
      - key: PUSH_NOTIFICATION_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
